# Copy frontend/dist/ to /var/www/university-merch-store/ and add these
# locations to the existing HTTPS server block. Keep /content and /api intact.
location = /store {
    return 308 /store/;
}

location /store/ {
    alias /var/www/university-merch-store/;
    try_files $uri $uri/ /store/index.html;
}

location = /project {
    return 308 /project/;
}

location /project/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 100k;
}
