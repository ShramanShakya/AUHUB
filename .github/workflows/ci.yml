name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: merch_test
          POSTGRES_USER: merch
          POSTGRES_PASSWORD: merch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merch -d merch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://merch:merch@localhost:5432/merch_test?schema=public
      TEST_DATABASE_URL: postgresql://merch:merch@localhost:5432/merch_test?schema=public
      RUN_INTEGRATION_TESTS: "true"
      ENTRA_TENANT_ID: 00000000-0000-4000-8000-000000000000
      ENTRA_AUDIENCE: api://test
      GEMINI_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run frontend:build
